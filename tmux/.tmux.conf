# Config

set -g base-index 1         # 设置窗口编号从 1 开始
set -g pane-base-index 1    # 设置面板编号从 1 开始
set -g renumber-windows on  # 关掉中间的窗口后，自动重新排序编号

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# 每次打开新的终端时，仍然停留在当前目录
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# <prefix>+hjkl 选择 pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# <prefix>+<C-p>/<C-n> 进入上一个或者下一个窗口
bind C-p previous-window
bind C-n next-window

# <prefix>+r 重新加载 tmux 配置
bind r source-file ~/.tmux.conf

# tmux 中翻页复制时，用 vim 的快捷键
setw -g mode-keys vi

# 增加历史容量
set -g history-limit 50000

# 设置终端为 256 色
set -g default-terminal "screen-256color"
set -as terminal-features ',xterm:RGB'

set -g focus-events on

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# don't rename windows automatically
set -g allow-rename off

set -g set-clipboard on

bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection

# statusbar

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin "janoamaral/tokyo-night-tmux"

set -g @tokyo-night-tmux_show_git 1             # local git status
set -g @tokyo-night-tmux_show_wbg 1             # GitHub / GitLab stats
set -g @tokyo-night-tmux_show_netspeed 1        # network speed
set -g @tokyo-night-tmux_show_battery_widget 1  # battery level
# set -g @tokyo-night-tmux_show_music 1           # now playing
# set -g @tokyo-night-tmux_show_path 1            # current path
# set -g @tokyo-night-tmux_show_hostname 1        # machine hostname

set -g @tokyo-night-tmux_window_id_style none   # window tab numbers
set -g @tokyo-night-tmux_pane_id_style hide     # pane number shown in status bar
set -g @tokyo-night-tmux_zoom_id_style hide     # pane number shown when zoomed

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

